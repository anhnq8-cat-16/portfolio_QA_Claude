<meta property="og:type" content="website">

<meta property="og:image" content="../assets/images/og-cover.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a href="#top" class="brand" id="brandLink">Mason<span>.</span></a>

    <nav class="main-nav" id="mainNav" aria-label="Chính">
      <a href="#about" data-nav="about"></a>
      <a href="#experience" data-nav="experience"></a>
      <a href="#projects" data-nav="projects"></a>
      <a href="#skills" data-nav="skills"></a>
      <a href="#education" data-nav="education"></a>
      <a href="#contact" data-nav="contact"></a>
    </nav>

    <div class="header-actions">
      <button type="button" class="lang-toggle" id="langToggle" aria-label="Đổi ngôn ngữ"></button>
      <a href="#" class="btn btn-line" id="headerCvBtn" download></a>
      <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mobileNav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="Di động">
    <a href="#about" data-nav="about"></a>
    <a href="#experience" data-nav="experience"></a>
    <a href="#projects" data-nav="projects"></a>
    <a href="#skills" data-nav="skills"></a>
    <a href="#education" data-nav="education"></a>
    <a href="#contact" data-nav="contact"></a>
  </nav>
</header>

<main id="main">

  <section class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow reveal-up" id="heroEyebrow"></p>
        <h1 class="hero-headline reveal-up" id="heroHeadline"></h1>
        <p class="hero-sub reveal-up" id="heroSub"></p>
        <div class="hero-actions reveal-up">
          <a href="#contact" class="btn btn-solid" id="heroContactBtn"></a>
          <a href="#" class="btn btn-line" id="heroCvBtn" download></a>
        </div>
      </div>
      <div class="hero-photo-wrap reveal-up">
        <img id="heroPhoto" src="" alt="" width="700" height="933">
      </div>
    </div>
    <button type="button" class="scroll-hint" id="scrollHint">
      <span id="scrollHintLabel"></span>
      <span class="scroll-hint-line" aria-hidden="true"></span>
    </button>
  </section>

  <section class="clients-strip" aria-labelledby="clientsEyebrow">
    <div class="wrap">
      <p class="eyebrow" id="clientsEyebrow"></p>
      <div class="clients-marquee" id="clientsMarquee"></div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap about-grid">
      <div class="about-copy">
        <p class="eyebrow reveal-up" id="aboutEyebrow"></p>
        <h2 class="section-heading reveal-up" id="aboutHeading"></h2>
        <div class="about-paragraphs" id="aboutParagraphs"></div>
      </div>
      <div class="about-photos" id="aboutPhotos"></div>
    </div>
    <div class="wrap">
      <div class="stats-grid" id="statsGrid"></div>
    </div>
  </section>

  <section class="experience" id="experience">
    <div class="wrap">
      <p class="eyebrow reveal-up" id="experienceEyebrow"></p>
      <h2 class="section-heading reveal-up" id="experienceHeading"></h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section class="projects" id="projects">
    <div class="wrap">
      <p class="eyebrow reveal-up" id="projectsEyebrow"></p>
      <h2 class="section-heading reveal-up" id="projectsHeading"></h2>
      <div class="projects-list" id="projectsList"></div>
    </div>
  </section>

  <section class="competencies" id="competencies">
    <div class="wrap">
      <p class="eyebrow reveal-up" id="competenciesEyebrow"></p>
      <h2 class="section-heading reveal-up" id="competenciesHeading"></h2>
      <div class="competencies-grid" id="competenciesGrid"></div>
    </div>
  </section>

  <section class="skills" id="skills">
    <div class="wrap">
      <p class="eyebrow reveal-up" id="skillsEyebrow"></p>
      <h2 class="section-heading reveal-up" id="skillsHeading"></h2>
      <div class="skills-grid" id="skillsGrid"></div>
      <div class="languages-row" id="languagesRow"></div>
    </div>
  </section>

  <section class="education" id="education">
    <div class="wrap">
      <p class="eyebrow reveal-up" id="educationEyebrow"></p>
      <h2 class="section-heading reveal-up" id="educationHeading"></h2>
      <div class="education-list" id="educationList"></div>
      <div class="certificates-list" id="certificatesList"></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <p class="eyebrow reveal-up" id="contactEyebrow"></p>
      <h2 class="section-heading reveal-up" id="contactHeading"></h2>
      <p class="contact-blurb reveal-up" id="contactBlurb"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="signature" id="footerSignature">Mason Nguyen</p>
    <p class="footer-note" id="footerNote"></p>
    <button type="button" class="back-to-top" id="backToTop"></button>
  </div>
</footer>

<script src="../data/content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
